<div
    class="group card w-[200px] max-xl:w-[90%] mb-5 bg-base-100 cursor-pointer shadow-xl hover:bg-base-300 transition"
    onclick="changeTeacher('<!--img-->')"
>
    <figure class="px-2 pt-2">
        <img
            src="img/beardify/<!--img-->.png"
            onerror="this.src='img/beardify/<!--img-->.png'"
            alt="Picture of <!--name-->"
            class="rounded-xl h-[200px] max-xl:h-full w-full object-fill"
        />
    </figure>
    <div class="card-body p-3 items-center text-center">
        <h2 class="font-semibold text-xl max-xl:text-base"><!--name--></h2>
    </div>
</div>
